# Database Configuration for Sunrise Dental Clinic
db.host=localhost
db.port=3306
db.name=sunrise_dental_clinic
db.user=root
db.password=admin
db.driver=com.mysql.cj.jdbc.Driver

db.url=jdbc:mysql://localhost:3306/sunrise_dental_clinic?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8

# Connection Pool Settings
db.pool.maxSize=10
db.pool.minIdle=2
db.pool.timeout=30000

# Application Settings
app.session.timeout=30
app.max.login.attempts=5
app.lock.duration=15