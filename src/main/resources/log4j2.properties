# Log4j2 Configuration
status = error
name = PropertiesConfig

# Console Appender
appender.console.type = Console
appender.console.name = ConsoleAppender
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n

# File Appender
appender.file.type = File
appender.file.name = FileAppender
appender.file.fileName = logs/sunrise-dental.log
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n
appender.file.append = true

# Root Logger
rootLogger.level = info
rootLogger.appenderRef.console.ref = ConsoleAppender
rootLogger.appenderRef.file.ref = FileAppender

# Application-specific loggers
logger.app.name = com.sunrisedental
logger.app.level = debug
logger.app.additivity = false
logger.app.appenderRef.console.ref = ConsoleAppender
logger.app.appenderRef.file.ref = FileAppender

logger.dao.name = com.sunrisedental.dao
logger.dao.level = debug
logger.dao.additivity = false
logger.dao.appenderRef.console.ref = ConsoleAppender
logger.dao.appenderRef.file.ref = FileAppender