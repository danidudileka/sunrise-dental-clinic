<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sunrise Dental Clinic</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="app-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>Sunrise Dental</h2>
            <p>Clinic Management System</p>
        </div>

        <nav class="sidebar-nav">
            <ul id="sidebar-menu">
                <!-- Menu items will be dynamically loaded based on role -->
            </ul>
        </nav>

        <div class="sidebar-footer">
            <div class="user-info">
                <span class="user-name" id="sidebar-user-name">Loading...</span>
                <span class="user-role" id="sidebar-user-role"></span>
            </div>
            <button id="logout-button" class="btn btn-outline btn-block">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <div class="page-header">
            <h1>Dashboard</h1>
            <p>Welcome back, <span id="welcome-name"></span></p>
        </div>

        <!-- Statistics Cards -->
        <div class="stats-grid" id="dashboard-stats">
            <div class="stat-card">
                <h3 id="today-appointments">0</h3>
                <p><i class="fas fa-calendar-day"></i> Today's Appointments</p>
            </div>

            <div class="stat-card success">
                <h3 id="week-appointments">0</h3>
                <p><i class="fas fa-calendar-week"></i> This Week's Appointments</p>
            </div>

            <div class="stat-card info">
                <h3 id="total-patients">0</h3>
                <p><i class="fas fa-users"></i> Total Patients</p>
            </div>

            <div class="stat-card warning">
                <h3 id="today-revenue">Rs. 0</h3>
                <p><i class="fas fa-money-bill"></i> Today's Revenue</p>
            </div>

            <div class="stat-card danger">
                <h3 id="month-revenue">Rs. 0</h3>
                <p><i class="fas fa-chart-line"></i> This Month's Revenue</p>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="card">
            <div class="card-header">
                <h2>Quick Actions</h2>
            </div>
            <div class="action-grid" id="quick-actions">
                <!-- Dynamic based on role -->
            </div>
        </div>
    </main>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/dashboard.js"></script>
</body>
</html>
