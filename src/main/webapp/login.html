<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sunrise Dental Clinic</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="login-page">
<div class="login-container">
    <div class="login-box">
        <div class="login-header">
            <img src="assets/images/logo.png" alt="Sunrise Dental Clinic Logo" class="logo"
                 onerror="this.style.display='none'">
            <h1>Sunrise Dental Clinic</h1>
            <p>Appointment & Patient Management System</p>
        </div>

        <div id="error-message" class="alert alert-error" style="display: none;"></div>
        <div id="success-message" class="alert alert-success" style="display: none;"></div>

        <form id="login-form" class="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control"
                       placeholder="Enter your username" required autocomplete="username">
                <small class="form-text">Default: admin</small>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control"
                       placeholder="Enter your password" required autocomplete="current-password">
                <small class="form-text">Default: admin123</small>
            </div>

            <div class="form-group form-check">
                <input type="checkbox" id="remember-me" class="form-check-input">
                <label for="remember-me" class="form-check-label">Remember me</label>
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="login-button">
                <span id="login-button-text">Login</span>
                <span id="login-button-spinner" class="spinner" style="display: none;"></span>
            </button>
        </form>

        <div class="login-footer">
            <p>&copy; 2024 Sunrise Dental Clinic. All rights reserved.</p>
            <p><a href="help.html">Need help?</a></p>
        </div>
    </div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script>
    // Check if already logged in
    document.addEventListener('DOMContentLoaded', function() {
        if (Auth.isAuthenticated()) {
            window.location.href = 'dashboard.html';
        }
    });
</script>
</body>
</html>
