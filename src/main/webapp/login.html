<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sunrise Dental Clinic</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-page">
<div class="login-container">
    <div class="login-box">
        <div class="login-header">
            <div class="login-logo">
                <i class="fas fa-tooth" style="font-size: 48px; color: #0d6efd;"></i>
            </div>
            <h1>Sunrise Dental Clinic</h1>
            <p>Appointment & Patient Management System</p>
        </div>

        <div id="error-message" class="alert alert-error" style="display: none;"></div>
        <div id="success-message" class="alert alert-success" style="display: none;"></div>

        <form id="login-form" class="login-form">
            <div class="form-group">
                <label for="username">
                    <i class="fas fa-user"></i> Username
                </label>
                <input type="text" id="username" name="username" class="form-control"
                       placeholder="Enter your username" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock"></i> Password
                </label>
                <input type="password" id="password" name="password" class="form-control"
                       placeholder="Enter your password" required autocomplete="current-password">
            </div>

            <div class="form-group form-check">
                <input type="checkbox" id="remember-me" class="form-check-input">
                <label for="remember-me">Remember me</label>
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="login-button">
                    <span id="login-button-text">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </span>
                <span id="login-button-spinner" class="spinner" style="display: none;">
                        <i class="fas fa-spinner fa-spin"></i> Logging in...
                    </span>
            </button>
        </form>

        <div class="login-footer">
            <p>&copy; 2026 Sunrise Dental Clinic. All rights reserved.</p>
            <p><a href="help.html"><i class="fas fa-question-circle"></i> Need help?</a></p>
        </div>
    </div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script>
    // Check if already logged in
    document.addEventListener('DOMContentLoaded', function() {
        if (Auth.isAuthenticated()) {
            const role = Auth.getUserInfo().role;
            if (role === 'DENTIST') {
                window.location.href = 'doctor-dashboard.html';
            } else {
                window.location.href = 'dashboard.html';
            }
        }
    });
</script>
</body>
</html>
