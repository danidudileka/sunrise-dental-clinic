<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing - Sunrise Dental Clinic</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
</head>
<body>
<div class="app-container">
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>Sunrise Dental</h2>
            <p>Clinic Management System</p>
        </div>
        <nav class="sidebar-nav">
            <ul id="sidebar-menu"></ul>
        </nav>
        <div class="sidebar-footer">
            <div class="user-info">
                <span class="user-name" id="sidebar-user-name">Loading...</span>
                <span class="user-role" id="sidebar-user-role"></span>
            </div>
            <button id="logout-button" class="btn btn-outline btn-block">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </aside>

    <main class="main-content">
        <div class="page-header">
            <h1>Billing Management</h1>
            <p>Generate bills and process payments</p>
        </div>

        <div class="card">
            <div class="card-header">
                <h2>Generate Bill</h2>
            </div>

            <div id="billing-error" class="alert alert-error" style="display: none;"></div>
            <div id="billing-success" class="alert alert-success" style="display: none;"></div>

            <div class="search-box">
                <input type="text" id="bill-appointment-number" class="form-control"
                       placeholder="Enter appointment number">
                <button onclick="calculateBill()" class="btn btn-secondary">
                    <i class="fas fa-calculator"></i> Calculate
                </button>
                <button onclick="generateBill()" class="btn btn-primary">
                    <i class="fas fa-file-invoice"></i> Generate Bill
                </button>
            </div>

            <div id="bill-preview" style="display: none;">
                <!-- Payment Status Banner -->
                <div id="payment-status-banner" class="payment-banner"></div>

                <div class="bill-header">
                    <h2>Sunrise Dental Clinic</h2>
                    <p>123 Main Street, Colombo 07</p>
                    <p>Tel: +94-11-2345678</p>
                </div>

                <div class="table-responsive">
                    <table class="table">
                        <tbody id="bill-details-body"></tbody>
                    </table>
                </div>

                <div class="bill-total">
                    <h3>Total Amount: <span id="bill-total-amount">Rs. 0.00</span></h3>
                </div>

                <div class="payment-section" id="payment-section" style="display: none;">
                    <h3>Process Payment</h3>
                    <div class="form-group">
                        <label>Payment Method</label>
                        <select id="payment-method" class="form-control">
                            <option value="CASH">Cash</option>
                            <option value="CARD">Card</option>
                            <option value="INSURANCE">Insurance</option>
                            <option value="ONLINE">Online Transfer</option>
                        </select>
                    </div>
                    <button onclick="processPayment()" class="btn btn-success">
                        <i class="fas fa-check-circle"></i> Process Payment
                    </button>
                </div>

                <div class="bill-actions">
                    <button onclick="printBill()" class="btn btn-secondary">
                        <i class="fas fa-print"></i> Print Bill
                    </button>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/billing.js"></script>
</body>
</html>
